name: Managed emulation inert guest image
on:
  # Required exact-head release checks must run for every pull request.
  pull_request: {}
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: managed-inert-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  owned-image:
    name: Owned inert guest BIOS and UEFI boot (not Hyper-V)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install CI-only image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kmod grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools qemu-system-x86 ovmf
      - name: Build pinned native owned-media generator
        shell: bash
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 build --locked --manifest-path workers/managed-emulation/host/Cargo.toml --bin owned-boot-media-fixture
      - name: Image parser and provisioning regressions
        run: python3 -B workers/managed-emulation/image/test_image.py
      - name: Fetch exact reviewed package bytes
        run: python3 -B workers/managed-emulation/image/fetch_inputs.py "$RUNNER_TEMP/managed-image-inputs"
      - name: Export immutable official runtime without starting a container
        shell: bash
        run: |
          set -euo pipefail
          image=$(python3 -c 'import json; print(json.load(open("workers/managed-emulation/image/inputs.lock.json"))["runtimeImage"])')
          docker pull --platform linux/amd64 "$image"
          container=$(docker create --network none --read-only --platform linux/amd64 "$image")
          trap 'docker rm "$container" >/dev/null' EXIT
          docker export "$container" > "$RUNNER_TEMP/managed-image-inputs/rootfs.tar"
      - name: Build owned development ISO (no engine installation or publication)
        run: |
          python3 -B workers/managed-emulation/image/build_image.py \
            --rootfs "$RUNNER_TEMP/managed-image-inputs/rootfs.tar" \
            --kernel "$RUNNER_TEMP/managed-image-inputs/kernel.deb" \
            --busybox "$RUNNER_TEMP/managed-image-inputs/busybox.deb" \
            --output "$RUNNER_TEMP/managed-inert-image" \
            --source-revision "$GITHUB_SHA"
      - name: Real networkless BIOS cold boot and missing-credential denial
        run: |
          python3 -B workers/managed-emulation/image/smoke_boot.py \
            --image "$RUNNER_TEMP/managed-inert-image/inert-guest.iso" \
            --log "$RUNNER_TEMP/managed-inert-image/bios.log" \
            --receipt "$RUNNER_TEMP/managed-inert-image/bios-receipt.json"
      - name: Real networkless UEFI cold boot and missing-credential denial
        run: |
          python3 -B workers/managed-emulation/image/smoke_boot.py \
            --image "$RUNNER_TEMP/managed-inert-image/inert-guest.iso" \
            --log "$RUNNER_TEMP/managed-inert-image/uefi.log" \
            --receipt "$RUNNER_TEMP/managed-inert-image/uefi-receipt.json" --uefi
      - name: Expired credential media is rejected inside the actual guest
        run: |
          python3 -B workers/managed-emulation/image/smoke_boot.py \
            --image "$RUNNER_TEMP/managed-inert-image/inert-guest.iso" \
            --log "$RUNNER_TEMP/managed-inert-image/expired.log" \
            --receipt "$RUNNER_TEMP/managed-inert-image/expired-receipt.json" --uefi --credential-case expired
      - name: Owned valid-format credential media provisions without readiness promotion
        run: |
          python3 -B workers/managed-emulation/image/smoke_boot.py \
            --image "$RUNNER_TEMP/managed-inert-image/inert-guest.iso" \
            --log "$RUNNER_TEMP/managed-inert-image/valid.log" \
            --receipt "$RUNNER_TEMP/managed-inert-image/valid-receipt.json" --uefi --credential-case valid
      - name: Native private boot media provisions inside the actual UEFI guest
        run: |
          python3 -B workers/managed-emulation/image/smoke_boot.py \
            --image "$RUNNER_TEMP/managed-inert-image/inert-guest.iso" \
            --log "$RUNNER_TEMP/managed-inert-image/native.log" \
            --receipt "$RUNNER_TEMP/managed-inert-image/native-receipt.json" --uefi --credential-case native \
            --native-media-generator workers/managed-emulation/host/target/debug/owned-boot-media-fixture
      - name: Retain scoped build and cold-boot evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: managed-inert-image-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/managed-inert-image/image-manifest.json
            ${{ runner.temp }}/managed-inert-image/*.log
            ${{ runner.temp }}/managed-inert-image/*-receipt.json
          if-no-files-found: warn
      - name: Explicit non-release scope
        run: echo 'CI-only owned ISO; no image binary published, no Hyper-V acceptance, framework install, Setup Center integration or containment/readiness claim.'
