name: Build custom Windows installer

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
    tags:
      - "desktop-v*"

concurrency:
  group: custom-windows-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.98.0"
  UPX_VERSION: "4.2.4"
  GITLEAKS_VERSION: "8.28.0"
  NSIS_VERSION: "3.11"

jobs:
  semantic-source-validation:
    uses: ./.github/workflows/semantic-source-validation.yml

  ghidra-owned-fixtures:
    name: Ghidra real owned fixtures (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Read supported Bun version
        id: toolchain
        shell: bash
        run: echo "version=$(node scripts/read-bun-version.mjs)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.toolchain.outputs.version }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build SDK
        run: bun run build:sdk
      - name: Install checksum-pinned Ghidra fixture
        run: node scripts/install-test-ghidra.mjs
      - name: Test actual headless import, reuse, renamed input and multi-script decompilation
        run: bun scripts/test-ghidra-integration.ts

  android-toolchain-preflight:
    name: Windows Android toolchain owned fixtures
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Read supported Bun version
        id: toolchain
        shell: bash
        run: echo "version=$(node scripts/read-bun-version.mjs)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.toolchain.outputs.version }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build SDK
        run: bun run build:sdk
      - name: Package and test Unicode owned Android fixtures
        shell: pwsh
        run: |
          & node --test scripts/pinned-android-download.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Pinned Android download regression tests failed" }
          & node scripts/package-android-toolchain.mjs
          if ($LASTEXITCODE -ne 0) { throw "Android preflight packaging failed" }
          $env:CLINE_ANDROID_TOOLCHAIN_ROOT = Join-Path $PWD "apps/examples/desktop-app/src-tauri/resources/android-toolchain"
          & bun scripts/test-android-toolchain.ts
          if ($LASTEXITCODE -ne 0) { throw "Android preflight owned fixtures failed" }

  build-windows-installer:
    needs: [ghidra-owned-fixtures, android-toolchain-preflight, semantic-source-validation]
    name: Validate and build Windows x64 setup.exe
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      artifact-name: ${{ steps.signing.outputs.artifact_name }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Read supported Bun version

        id: toolchain

        shell: bash

        run: echo "version=$(node "$GITHUB_WORKSPACE/scripts/read-bun-version.mjs")" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.toolchain.outputs.version }}

      # Cheap, dependency-free failures must precede downloads/compiler setup.
      # This is feedback only: the complete validator and installed gate still run.
      - name: Fast verification preflight
        run: bun run validate:quick

      - name: Restore locked Bun download cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('bun.lock', 'workers/android-capture/bun.lock') }}

      - name: Read and validate desktop version
        id: version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./apps/examples/desktop-app/package.json').version")"
          TAURI_VERSION="$(node -p "require('./apps/examples/desktop-app/src-tauri/tauri.conf.json').version")"
          if [ "$PACKAGE_VERSION" != "$TAURI_VERSION" ]; then
            echo "Desktop package version $PACKAGE_VERSION does not match Tauri version $TAURI_VERSION"
            exit 1
          fi
          if ! printf '%s\n' "$PACKAGE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid desktop version: $PACKAGE_VERSION"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#desktop-v}"
            if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
              echo "Tag version $TAG_VERSION does not match desktop version $PACKAGE_VERSION"
              exit 1
            fi
          fi
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      # The desktop packaging script embeds Linux remote helpers. Bun's
      # Windows extraction path cannot reliably unpack these target runtimes,
      # so seed the exact target binaries in Bun's cache first.
      - name: Seed Bun cache for Linux remote helpers
        shell: bash
        run: |
          BUN_VERSION="$(bun --version)"
          CACHE_DIR="${RUNNER_TEMP//\\//}/bun-install-cache"
          mkdir -p "$CACHE_DIR"
          for target in linux-x64-baseline linux-aarch64; do
            dest="$CACHE_DIR/bun-$target-v$BUN_VERSION"
            work="$(mktemp -d)"
            (
              cd "$work"
              npm pack "@oven/bun-$target@$BUN_VERSION" --silent >/dev/null
              tar -xzf ./*.tgz package/bin/bun
            )
            mv "$work/package/bin/bun" "$dest"
            test "$(head -c 4 "$dest" | od -An -c | tr -d ' ')" = "177ELF"
          done
          echo "BUN_INSTALL_CACHE_DIR=${CACHE_DIR}" >> "$GITHUB_ENV"

      - name: Install Windows packaging tools
        shell: pwsh
        run: |
          & pwsh -NoProfile -File scripts/install-pinned-windows-tool.test.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Pinned tool retry fixtures failed' }
          & scripts/install-pinned-windows-tool.ps1 -Package upx -Version $env:UPX_VERSION
          & scripts/install-pinned-gitleaks.ps1 -Version $env:GITLEAKS_VERSION
          $zip = Join-Path $env:RUNNER_TEMP 'nsis.zip'
          $nsisUrl = "https://github.com/tauri-apps/binary-releases/releases/download/nsis-$env:NSIS_VERSION/nsis-$env:NSIS_VERSION.zip"
          Invoke-WebRequest $nsisUrl -OutFile $zip
          $expected = 'C7D27F780DDB6CFFB4730138CD1591E841F4B7EDB155856901CDF5F214394FA1'
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "NSIS checksum mismatch: $actual" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "MAKENSIS_PATH=$env:RUNNER_TEMP/nsis-$env:NSIS_VERSION/makensis.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Restore Cargo cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/examples/desktop-app/src-tauri/target
            !apps/examples/desktop-app/src-tauri/target/release/bundle/**
          # Refresh immutable caches when Rust inputs change; the old lock-only
          # key never saved newer compiler outputs after an exact cache hit.
          # Cargo still rebuilds/checks inputs; no cached installer is accepted.
          key: windows-cargo-v2-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('apps/examples/desktop-app/src-tauri/Cargo.lock') }}-${{ hashFiles('apps/examples/desktop-app/src-tauri/src/**/*.rs', 'apps/examples/desktop-app/src-tauri/build.rs', 'apps/examples/desktop-app/src-tauri/Cargo.toml', 'apps/examples/desktop-app/src-tauri/tauri*.json') }}-${{ github.sha }}
          restore-keys: |
            windows-cargo-v2-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('apps/examples/desktop-app/src-tauri/Cargo.lock') }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate opt-in native WebView launch settings
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'installed-webview-launch-tests.exe'
          & rustc --edition=2021 --test apps/examples/desktop-app/src-tauri/src/installed_webview_launch.rs -o $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Native WebView launch fixture compilation failed' }
          & $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Native WebView launch option fixtures failed' }

      - name: Verify secret scanner exception scope
        run: node scripts/test-secret-scan-fixtures.mjs

      - name: Scan repository for committed secrets
        shell: bash
        run: gitleaks git --redact --no-banner --config .gitleaks.toml

      - name: Run consolidated custom fork validation
        id: consolidated
        # Outer guard remains effective if the validator or hosted runner stops
        # servicing its own per-check timers. Do not bypass any required gate.
        timeout-minutes: 35
        env:
          CLINE_VALIDATION_PARALLEL: "1"
        run: bun run validate:advanced

      - name: Package and round-trip-test pinned Android Analysis Pack
        timeout-minutes: 15
        shell: pwsh
        run: |
          & node --test scripts/pinned-android-download.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Pinned Android download regression tests failed" }
          & node scripts/package-android-toolchain.mjs
          if ($LASTEXITCODE -ne 0) { throw "Android toolchain packaging failed" }
          $env:CLINE_ANDROID_TOOLCHAIN_ROOT = Join-Path $PWD "apps/examples/desktop-app/src-tauri/resources/android-toolchain"
          & bun scripts/test-android-toolchain.ts
          if ($LASTEXITCODE -ne 0) { throw "Android owned round-trip acceptance failed" }

      - name: Restore exact Windows engine wheel cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cline-wheels
          key: windows-x64-cpython313-wheels-${{ hashFiles('sdk/packages/core/scripts/requirements-advanced*.txt', 'scripts/install-windows-engine-wheels.ps1', 'scripts/wheelhouse-manifest.mjs', 'scripts/run-bounded-process.mjs') }}

      - name: Validate portable Windows analysis engines
        timeout-minutes: 45
        env:
          CLINE_VALIDATION_PARALLEL: "1"
          CLINE_VALIDATION_CORE_RECEIPT: ${{ steps.consolidated.outputs.validation_receipt }}
        shell: pwsh
        run: |
          # Miasm uses clang-cl plus the first link.exe on PATH. Import the
          # supported x64 VS environment so Git's Unix link cannot be selected.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere was not found' }
          $vsRoot = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vsRoot) { throw 'Required x64 Visual C++ tools were not found' }
          $vsRoot = $vsRoot.Trim()
          $devCmd = Join-Path $vsRoot 'Common7/Tools/VsDevCmd.bat'
          if (-not (Test-Path $devCmd)) { throw 'Visual Studio developer command script was not found' }
          $vsEnvironment = & $env:COMSPEC /d /s /c "`"$devCmd`" -no_logo -arch=amd64 -host_arch=amd64 && set"
          if ($LASTEXITCODE -ne 0) { throw 'Visual Studio x64 environment initialization failed' }
          foreach ($line in $vsEnvironment) {
            $separator = $line.IndexOf('=')
            if ($separator -gt 0) { [Environment]::SetEnvironmentVariable($line.Substring(0, $separator), $line.Substring($separator + 1), 'Process') }
          }
          $linker = (Get-Command link.exe -CommandType Application -ErrorAction Stop).Source
          if (-not $linker.StartsWith($vsRoot + '\', [StringComparison]::OrdinalIgnoreCase)) { throw "Expected Microsoft linker, resolved: $linker" }
          Write-Host "Verified Microsoft linker: $linker"
          $engineRoot = Join-Path $env:RUNNER_TEMP 'cline-portable-engines'
          py -3.13 -m venv $engineRoot
          if ($LASTEXITCODE -ne 0) { throw "Python 3.13 environment creation failed" }
          $python = Join-Path $engineRoot 'Scripts/python.exe'
          ./scripts/install-windows-engine-wheels.ps1 -Python $python -Requirements sdk/packages/core/scripts/requirements-advanced-windows.txt -Wheelhouse .cline-wheels/portable
          if ($LASTEXITCODE -ne 0) { throw "Pinned portable engine installation failed" }
          & $python workers/android-capture/server.test.py
          if ($LASTEXITCODE -ne 0) { throw "Owned Android protocol fixtures failed (not live-device validation)" }
          & $python workers/android-capture/capture_support.test.py
          if ($LASTEXITCODE -ne 0) { throw "Bounded native module fixtures failed (not live-device validation)" }
          & $python workers/android-capture/setup-controller.test.py
          if ($LASTEXITCODE -ne 0) { throw "Controller setup plan fixtures failed (not VM provisioning evidence)" }
          $env:CLINE_RE_PYTHON = $python
          "CLINE_RE_PYTHON=$python" >> $env:GITHUB_ENV
          # Reuse only the complete passing core receipt from this same job,
          # source commit and run attempt. Every real engine corpus still runs.
          & bun run validate:advanced --engines --reuse-core
          if ($LASTEXITCODE -ne 0) { throw 'Real optional engine fixture corpora failed' }
          Push-Location sdk
          try { bun test packages/core/scripts/advanced-windows-engine-smoke.test.ts; if ($LASTEXITCODE -ne 0) { throw "Real portable engine execution failed" } }
          finally { Pop-Location }

      - name: Package isolated analysis runtime for install-and-use
        timeout-minutes: 15
        shell: pwsh
        run: |
          ./scripts/package-analysis-runtime.ps1 -EnginePython $env:CLINE_RE_PYTHON
          if ($LASTEXITCODE -ne 0) { throw "Bundled runtime packaging failed" }

      - name: Build and package full private capability packs
        timeout-minutes: 55
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsRoot = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $vsRoot) { throw 'Full pack requires verified Visual C++ tools' }
          $devCmd = Join-Path $vsRoot 'Common7/Tools/VsDevCmd.bat'
          $vars = & $env:COMSPEC /d /s /c "`"$devCmd`" -no_logo -arch=amd64 -host_arch=amd64 && set"
          if ($LASTEXITCODE -ne 0) { throw 'Full pack compiler environment failed' }
          foreach ($line in $vars) { $i=$line.IndexOf('='); if ($i -gt 0) { [Environment]::SetEnvironmentVariable($line.Substring(0,$i),$line.Substring($i+1),'Process') } }
          foreach ($pack in @('full','angr')) {
            $venv = Join-Path $env:RUNNER_TEMP "cline-$pack-engines"
            py -3.13 -m venv $venv
            if ($LASTEXITCODE -ne 0) { throw 'Full pack venv creation failed' }
            $python = Join-Path $venv 'Scripts/python.exe'
            $pins = if ($pack -eq 'full') { 'sdk/packages/core/scripts/requirements-advanced-full-windows.txt' } else { 'sdk/packages/core/scripts/requirements-advanced-angr.txt' }
            ./scripts/install-windows-engine-wheels.ps1 -Python $python -Requirements $pins -Wheelhouse ".cline-wheels/$pack" -FindLinks .cline-wheels/portable
            if ($LASTEXITCODE -ne 0) { throw "Full pack dependency build failed: $pack" }
            ./scripts/package-analysis-runtime.ps1 -EnginePython $python -Pack $pack
            if ($LASTEXITCODE -ne 0) { throw "Full pack execution/packaging failed: $pack" }
          }

      - name: Package and execution-test Binary Triage Pack
        timeout-minutes: 15
        shell: pwsh
        run: ./scripts/package-binary-triage.ps1

      - name: Package official Android connectivity tools
        shell: pwsh
        run: ./scripts/package-android-platform-tools.ps1

      - name: Build pinned Android instrumentation bundle
        working-directory: workers/android-capture
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw "Pinned Android agent dependency installation failed" }
          bun run build
          if ($LASTEXITCODE -ne 0) { throw "Android instrumentation compilation failed (not live-device validation)" }

      - name: Upload consolidated validation evidence
        if: ${{ always() && (steps.consolidated.outcome == 'success' || steps.consolidated.outcome == 'failure' || steps.consolidated.outcome == 'cancelled') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: consolidated-validation-${{ github.run_id }}
          path: .cline-validation/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Run process-session terminal smoke test
        shell: bash
        run: |
          bun build sdk/packages/core/scripts/process-session-terminal-smoke.ts \
            --compile \
            --outfile "$RUNNER_TEMP/process-session-terminal-smoke.exe"
          "$RUNNER_TEMP/process-session-terminal-smoke.exe"

      - name: Restore Next compiler cache only
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: apps/examples/desktop-app/webview/.next/cache
          key: next-compiler-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            next-compiler-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('bun.lock') }}-

      - name: Build NSIS installer
        working-directory: apps/examples/desktop-app
        shell: pwsh
        run: |
          # Cargo cache includes old bundle outputs. Never select an old installer
          # merely because its filename/version still matches this source.
          Remove-Item 'src-tauri/target/release/bundle/nsis' -Recurse -Force -ErrorAction SilentlyContinue
          & bunx tauri build --bundles nsis --config src-tauri/tauri.analysis-runtime.conf.json
          if ($LASTEXITCODE -ne 0) { throw "Tauri build failed with exit code $LASTEXITCODE" }

      - name: Test native browser capture metadata boundaries
        timeout-minutes: 10
        shell: pwsh
        run: |
          cargo test --locked --manifest-path apps/examples/desktop-app/src-tauri/Cargo.toml browser_capture::
          if ($LASTEXITCODE -ne 0) { throw 'Native browser capture boundary fixtures failed' }
          cargo test --locked --manifest-path apps/examples/desktop-app/src-tauri/Cargo.toml browser_readiness::
          if ($LASTEXITCODE -ne 0) { throw 'Native browser readiness fixtures failed' }

      - name: Select unsigned private installer
        id: signing
        shell: pwsh
        working-directory: apps/examples/desktop-app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $setups = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' -Recurse)
          if ($setups.Count -ne 1) { throw 'Expected exactly one fresh installer' }
          if ((Get-AuthenticodeSignature $setups[0].FullName).Status -ne 'NotSigned') { throw 'Private installer must be unsigned' }
          "signed=false" >> $env:GITHUB_OUTPUT
          "filename=Cline-Enhanced_$env:VERSION`_x64-unsigned-setup.exe" >> $env:GITHUB_OUTPUT
          "artifact_name=cline-enhanced-windows-x64-unsigned-$env:VERSION-${{ github.run_id }}-${{ github.run_attempt }}" >> $env:GITHUB_OUTPUT

      - name: Collect and verify installer
        id: installer
        shell: pwsh
        working-directory: apps/examples/desktop-app
        env:
          OUTPUT_FILENAME: ${{ steps.signing.outputs.filename }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $bundleRoot = 'src-tauri/target/release/bundle/nsis'
          $setup = Get-ChildItem $bundleRoot -Filter '*-setup.exe' -Recurse | Select-Object -First 1
          if (-not $setup) { throw "No setup.exe was produced under $bundleRoot" }

          $signature = Get-AuthenticodeSignature $setup.FullName
          $expectedStatus = if ('${{ steps.signing.outputs.signed }}' -eq 'true') { 'Valid' } else { 'NotSigned' }
          if ($signature.Status -ne $expectedStatus) {
            throw "Expected installer signature status $expectedStatus, got $($signature.Status)"
          }

          $out = 'dist/custom-installer'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $destination = Join-Path $out $env:OUTPUT_FILENAME
          Copy-Item $setup.FullName $destination -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'CUSTOMIZATIONS.md') (Join-Path $out 'CUSTOMIZATIONS.md') -Force

          $copiedSignature = Get-AuthenticodeSignature $destination
          if ($copiedSignature.Status -ne $expectedStatus) {
            throw "Copied installer signature status is $($copiedSignature.Status), expected $expectedStatus"
          }

          $hash = (Get-FileHash $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:OUTPUT_FILENAME" | Out-File (Join-Path $out 'SHA256SUMS.txt') -Encoding ascii
          [ordered]@{
            schema = 'https://cline.bot/provenance/windows-installer/v1'
            subject = [ordered]@{
              name = $env:OUTPUT_FILENAME
              sha256 = $hash
            }
            source = [ordered]@{
              repository = $env:GITHUB_REPOSITORY
              commit = $env:GITHUB_SHA
              ref = $env:GITHUB_REF
            }
            build = [ordered]@{
              workflow = $env:GITHUB_WORKFLOW
              run_id = $env:GITHUB_RUN_ID
              run_attempt = $env:GITHUB_RUN_ATTEMPT
              runner = "$env:RUNNER_OS $env:RUNNER_ARCH"
              signed = '${{ steps.signing.outputs.signed }}' -eq 'true'
            }
          } | ConvertTo-Json -Depth 5 |
            Out-File (Join-Path $out 'PROVENANCE.json') -Encoding utf8
          [ordered]@{
            spdxVersion = 'SPDX-2.3'
            dataLicense = 'CC0-1.0'
            SPDXID = 'SPDXRef-DOCUMENT'
            name = "Cline-Enhanced-$env:VERSION"
            documentNamespace = "https://cline.bot/spdx/$env:VERSION/$env:GITHUB_SHA"
            creationInfo = [ordered]@{
              created = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
              creators = @('Tool: Cline-Enhanced-GitHub-Actions')
            }
            packages = @(
              [ordered]@{
                name = 'Cline Enhanced Desktop'
                SPDXID = 'SPDXRef-Package-Cline-Enhanced'
                versionInfo = $env:VERSION
                downloadLocation = 'NOASSERTION'
                filesAnalyzed = $false
                checksums = @(
                  [ordered]@{ algorithm = 'SHA256'; checksumValue = $hash }
                )
              }
            )
            relationships = @(
              [ordered]@{
                spdxElementId = 'SPDXRef-DOCUMENT'
                relationshipType = 'DESCRIBES'
                relatedSpdxElement = 'SPDXRef-Package-Cline-Enhanced'
              }
            )
          } | ConvertTo-Json -Depth 8 |
            Out-File (Join-Path $out 'SBOM.spdx.json') -Encoding utf8
          @(
            "Version: $env:VERSION"
            "Commit: $env:GITHUB_SHA"
            "Runner: $env:RUNNER_OS $env:RUNNER_ARCH"
            "Signed: ${{ steps.signing.outputs.signed }}"
            "Bun: $(bun --version)"
            "Rust: $(rustc --version)"
            "UPX: $(upx --version | Select-Object -First 1)"
            "NSIS: $env:NSIS_VERSION"
            "Purpose: unsigned private testing; artifact-only; no release"
            "Customization ledger: CUSTOMIZATIONS.md"
          ) | Out-File (Join-Path $out 'BUILD-INFO.txt') -Encoding utf8
          "path=$destination" >> $env:GITHUB_OUTPUT
          Get-ChildItem $out | Format-Table Name, Length

      - name: Smoke-test installer and installed binaries
        id: smoke
        shell: pwsh
        working-directory: apps/examples/desktop-app
        env:
          OUTPUT_FILENAME: ${{ steps.signing.outputs.filename }}
        run: |
          $setup = (Resolve-Path "dist/custom-installer/$env:OUTPUT_FILENAME").Path
          $setupSignature = Get-AuthenticodeSignature $setup
          $expectedStatus = if ('${{ steps.signing.outputs.signed }}' -eq 'true') { 'Valid' } else { 'NotSigned' }
          if ($setupSignature.Status -ne $expectedStatus) {
            throw "Expected installer signature status $expectedStatus, got $($setupSignature.Status)"
          }

          $process = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "NSIS silent installation failed with exit code $($process.ExitCode)"
          }

          $uninstallRoots = @(
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )
          $entry = Get-ItemProperty $uninstallRoots -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq 'Cline Enhanced' } |
            Select-Object -First 1
          if (-not $entry) { throw 'Installed Cline Enhanced registry entry not found' }

          $installLocation = $entry.InstallLocation
          if (-not $installLocation -or -not (Test-Path $installLocation)) {
            $uninstallExe = $entry.UninstallString -replace '^"|"$', ''
            $installLocation = Split-Path $uninstallExe -Parent
          }
          $appExe = Get-ChildItem $installLocation -Filter 'cline-app.exe' -Recurse | Select-Object -First 1
          $sidecarExe = Get-ChildItem $installLocation -Filter 'code-sidecar.exe' -Recurse | Select-Object -First 1
          if (-not $appExe) { throw "cline-app.exe not found under $installLocation" }
          if (-not $sidecarExe) { throw "code-sidecar.exe not found under $installLocation" }
          $builtSidecar = 'src-tauri/bin/code-sidecar-x86_64-pc-windows-msvc.exe'
          if (-not (Test-Path $builtSidecar)) { throw 'Current built sidecar is missing' }
          $builtHash = (Get-FileHash $builtSidecar -Algorithm SHA256).Hash
          $installedHash = (Get-FileHash $sidecarExe.FullName -Algorithm SHA256).Hash
          if ($builtHash -ne $installedHash) {
            throw 'Installed sidecar does not match the current source build'
          }
          "Installed sidecar SHA256: $installedHash" | Out-File 'dist/custom-installer/BUILD-INFO.txt' -Encoding utf8 -Append


          foreach ($binary in @($appExe, $sidecarExe)) {
            $signature = Get-AuthenticodeSignature $binary.FullName
            if ($signature.Status -ne 'NotSigned') {
              throw "$($binary.Name) is unexpectedly signed: $($signature.Status)"
            }
          }

          # The installed executable must host its fixed parser child without system Node/npm.
          $analysisSelfcheck = & $sidecarExe.FullName --cline-analysis-selfcheck
          if ($LASTEXITCODE -ne 0) { throw 'Installed first-party parser fixture failed' }
          $analysisReceipt = $analysisSelfcheck | ConvertFrom-Json
          if ($analysisReceipt.status -ne 'passed') { throw 'Installed parser did not produce a passed receipt' }

          # Validate the installed sidecar by its observable contract instead of
          # relying on a Win32_Process name/path snapshot. The app can replace
          # its first sidecar with the detached Hub daemon during startup, so a
          # one-time CIM query can miss a healthy transition. This established
          # startup test uses isolated CLINE_* paths, waits for the ready line,
          # and verifies the installed binary's /health endpoint.
          $env:CLINE_TEST_SIDECAR_BIN = $sidecarExe.FullName
          try {
            & bun test scripts/desktop-startup.test.ts
            if ($LASTEXITCODE -ne 0) {
              throw "Installed code-sidecar.exe startup test failed with exit code $LASTEXITCODE"
            }
          } finally {
            Remove-Item Env:\CLINE_TEST_SIDECAR_BIN -ErrorAction SilentlyContinue
          }

          $app = Start-Process -FilePath $appExe.FullName -PassThru
          Start-Sleep -Seconds 15
          $app.Refresh()
          if ($app.HasExited) {
            $events = Get-WinEvent -FilterHashtable @{
              LogName = 'Application'
              StartTime = (Get-Date).AddMinutes(-5)
            } -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'cline-app|Cline Enhanced' } |
              Select-Object -First 5 |
              Format-List -Property TimeCreated, Id, LevelDisplayName, Message |
              Out-String
            throw "Installed app exited during startup with code $($app.ExitCode). Events:`n$events"
          }

          Write-Host 'Installer, installed app, and sidecar verified successfully.'
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          # Reuse the exact binaries whose installed hashes/startup were verified.
          # Registry InstallLocation can be quoted; never rediscover it in the UI step.
          "CLINE_TEST_INSTALLED_APP=$($appExe.FullName)" >> $env:GITHUB_ENV
          "CLINE_TEST_INSTALLED_SIDECAR=$($sidecarExe.FullName)" >> $env:GITHUB_ENV

      - name: Installed WebView acceptance journey
        timeout-minutes: 20
        id: ui_acceptance
        shell: pwsh
        working-directory: apps/examples/desktop-app
        run: |
          foreach ($name in @('CLINE_TEST_INSTALLED_APP', 'CLINE_TEST_INSTALLED_SIDECAR')) {
            $path = [Environment]::GetEnvironmentVariable($name)
            if (-not $path -or -not [IO.Path]::IsPathFullyQualified($path) -or -not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Verified installed binary path is missing or invalid: $name"
            }
          }
          node --experimental-strip-types ../../vscode/scripts/desktop-installed-acceptance.ts
          if ($LASTEXITCODE -ne 0) { throw 'Installed WebView acceptance failed' }

      - name: Publish bounded installed acceptance failure
        if: ${{ always() && steps.ui_acceptance.outcome == 'failure' }}
        shell: pwsh
        run: node scripts/report-installed-acceptance.mjs apps/examples/desktop-app/dist/installed-ui-evidence/summary.json

      - name: Upload installed UI acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installed-ui-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/examples/desktop-app/dist/installed-ui-evidence/**
          if-no-files-found: warn
          retention-days: 14

      - name: Record installer smoke-test result
        if: ${{ always() && steps.installer.outcome == 'success' }}
        shell: pwsh
        working-directory: apps/examples/desktop-app
        run: |
          "Smoke test: ${{ steps.smoke.outcome }}; Installed UI: ${{ steps.ui_acceptance.outcome }}" |
            Out-File 'dist/custom-installer/BUILD-INFO.txt' -Encoding utf8 -Append

      - name: Summarize verification bottlenecks
        if: ${{ always() }}
        shell: pwsh
        run: node scripts/summarize-verification.mjs

      - name: Write dependency source inventory
        if: ${{ steps.installer.outcome == 'success' }}
        shell: pwsh
        run: |
          bun scripts/write-dependency-inventory.ts apps/examples/desktop-app/dist/custom-installer/DEPENDENCIES.cdx.json
          if ($LASTEXITCODE -ne 0) { throw 'Dependency source inventory generation failed' }

      - name: Upload verified setup.exe
        if: ${{ steps.installer.outcome == 'success' && steps.smoke.outcome == 'success' && steps.ui_acceptance.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.signing.outputs.artifact_name }}
          path: apps/examples/desktop-app/dist/custom-installer/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload failed-smoke diagnostics
        if: ${{ always() && steps.installer.outcome == 'success' && (steps.smoke.outcome == 'failure' || steps.ui_acceptance.outcome == 'failure') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: failed-smoke-${{ steps.version.outputs.version }}-${{ github.run_id }}
          path: apps/examples/desktop-app/dist/custom-installer/*
          if-no-files-found: error
          retention-days: 7
