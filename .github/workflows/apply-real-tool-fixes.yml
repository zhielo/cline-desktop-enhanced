name: Apply real IDA and Ghidra compatibility fixes

on:
  push:
    branches:
      - fix/windows-ida-ghidra-real-tool

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Apply fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path(".github/scripts/apply-real-tool-fixes.py")
          source = path.read_text()
          pattern = r"\nreplace_once\(\n(?:(?!\nreplace_once\().)*?idaScriptVersion: IDA_SCRIPT_VERSION.*?\n\)\n"
          source, count = re.subn(pattern, "\n", source, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError("could not remove the brittle IDA options-hash patch")
          source = source.replace(
              r"\t\tlet reusedAnalysis = false;\n\t\tlet args: string[];",
              r"\t\t\tlet reusedAnalysis = false;\n\t\t\tlet args: string[];",
          ).replace(
              r"\t\tlet reusedAnalysis = false;\n\t\tlet args: string[];\n\t\tlet expectedOutput: string | undefined;",
              r"\t\t\tlet reusedAnalysis = false;\n\t\t\tlet args: string[];\n\t\t\tlet expectedOutput: string | undefined;",
          )
          for name in ("old_ida", "new_ida", "old_success", "new_success"):
              block_pattern = rf"({name} = r'''\n)(.*?)(\n''')"
              match = re.search(block_pattern, source, flags=re.S)
              if not match:
                  raise RuntimeError(f"could not find {name}")
              body = "\n".join("\t" + line if line.startswith("\t") else line for line in match.group(2).split("\n"))
              source = source[:match.start()] + match.group(1) + body + match.group(3) + source[match.end():]
          source = source.replace(
              r"\t\t\tartifactsTruncated: artifacts.length >= 200,\n\t\t\t...result,",
              r"\t\t\t\t\tartifactsTruncated: artifacts.length >= 200,\n\t\t\t\t\t...result,",
          ).replace(
              r"\t\t\tartifactsTruncated: artifacts.length >= 200,\n\t\t\tsucceeded,\n\t\t\t...result,",
              r"\t\t\t\t\tartifactsTruncated: artifacts.length >= 200,\n\t\t\t\t\tsucceeded,\n\t\t\t\t\t...result,",
          )
          path.write_text(source)
          PY
          set +e
          output="$(python3 .github/scripts/apply-real-tool-fixes.py 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            encoded="$(printf '%s' "$output" | sed 's/%/%25/g; s/\r/%0D/g; :a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=Patch script failed::$encoded"
            exit "$status"
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path("sdk/packages/core/src/extensions/tools/executors/reverse-engineering.ts")
          source = path.read_text()
          ida_start = source.index(': engine === "ida"')
          marker = "script_args: input.script_args ?? [],"
          marker_start = source.index(marker, ida_start)
          line_end = source.index("\n", marker_start) + 1
          source = source[:line_end] + "\t\t\t\tidaScriptVersion: IDA_SCRIPT_VERSION,\n" + source[line_end:]
          path.write_text(source)
          PY
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format touched files
        run: bunx --bun @biomejs/biome format --write sdk/packages/core/src/extensions/tools/executors/reverse-engineering.ts sdk/packages/core/src/extensions/tools/executors/reverse-engineering.test.ts CUSTOMIZATIONS.md scripts/verify-custom-fork.ts
      - name: Build SDK
        run: bun run build:sdk
      - name: Type-check core
        run: bun -F @cline/core typecheck
      - name: Run focused tests
        run: cd sdk/packages/core && bun x vitest run src/extensions/tools/executors/reverse-engineering.test.ts src/extensions/tools/executors/supervised-process.test.ts src/extensions/tools/executors/live-debugger.test.ts --config vitest.config.ts
      - name: Verify custom fork
        run: bun scripts/verify-custom-fork.ts
      - name: Commit validated fixes
        run: |
          git rm .github/workflows/apply-real-tool-fixes.yml .github/scripts/apply-real-tool-fixes.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          HUSKY=0 git commit -m "fix: support real Windows IDA and nested Ghidra installs"
          git push
