name: Apply real IDA and Ghidra compatibility fixes

on:
  push:
    branches:
      - fix/windows-ida-ghidra-real-tool

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Apply fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path(".github/scripts/apply-real-tool-fixes.py")
          source = path.read_text()
          source = source.replace(
              r"\n\t\t\t\t\tscript_path: input.script_path",
              r"\n\t\t\t\tscript_path: input.script_path",
          )
          source = source.replace(
              r"\n\t\t\t\t\tscript_args: input.script_args",
              r"\n\t\t\t\tscript_args: input.script_args",
          )
          source = source.replace(
              r"\n\t\t\t\t\tidaScriptVersion: IDA_SCRIPT_VERSION",
              r"\n\t\t\t\tidaScriptVersion: IDA_SCRIPT_VERSION",
          )
          source = source.replace(r"\n\t\t\t\t\t}", r"\n\t\t\t\t}")
          path.write_text(source)
          PY
          set +e
          output="$(python3 .github/scripts/apply-real-tool-fixes.py 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            encoded="$(printf '%s' "$output" | sed 's/%/%25/g; s/\r/%0D/g; :a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=Patch script failed::$encoded"
            exit "$status"
          fi
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format touched files
        run: bunx --bun @biomejs/biome format --write sdk/packages/core/src/extensions/tools/executors/reverse-engineering.ts sdk/packages/core/src/extensions/tools/executors/reverse-engineering.test.ts CUSTOMIZATIONS.md scripts/verify-custom-fork.ts
      - name: Build SDK
        run: bun run build:sdk
      - name: Type-check core
        run: bun -F @cline/core typecheck
      - name: Run focused tests
        run: cd sdk/packages/core && bun x vitest run src/extensions/tools/executors/reverse-engineering.test.ts src/extensions/tools/executors/supervised-process.test.ts src/extensions/tools/executors/live-debugger.test.ts --config vitest.config.ts
      - name: Verify custom fork
        run: bun scripts/verify-custom-fork.ts
      - name: Commit validated fixes
        run: |
          git rm .github/workflows/apply-real-tool-fixes.yml .github/scripts/apply-real-tool-fixes.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          HUSKY=0 git commit -m "fix: support real Windows IDA and nested Ghidra installs"
          git push
