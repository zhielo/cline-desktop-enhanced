name: Apply focused IDA startup fix
on:
  push:
    branches: [feature/advanced-re-tooling-ui]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/advanced-re-tooling-ui
          fetch-depth: 0
      - name: Apply and commit validated patch
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode | git apply --check
          printf '%s' "$PATCH_B64" | base64 --decode | git apply
          rm -f .github/workflows/apply-ida-fix.yml .github/IDA_FIX_TRIGGER
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix supervised IDA startup diagnostics"
          git push origin HEAD:feature/advanced-re-tooling-ui
