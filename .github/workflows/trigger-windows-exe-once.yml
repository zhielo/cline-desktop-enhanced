name: trigger-windows-exe-once
on:
  push:
    branches:
      - feature/windows-re-tooling-task-ui
    paths:
      - .github/workflows/trigger-windows-exe-once.yml
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Start Windows x64 setup.exe build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-custom-windows-installer.yml --ref feature/windows-re-tooling-task-ui
