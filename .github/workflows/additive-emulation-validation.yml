name: Additive emulation acceptance
on:
  pull_request:
    branches: [main, desktop-experimental]
  push:
    branches: [main, desktop-experimental]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: additive-emulation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engines:
    name: Owned additive emulation (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [qiling, unidbg, rnidbg]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Install owned build prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang lld cmake libssl-dev pkg-config maven
      - name: Prepare separate Python environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/engine-venv"
          "$RUNNER_TEMP/engine-venv/bin/python" -m pip install -r workers/emulation/requirements-transport.txt
          if [[ '${{ matrix.engine }}' == qiling ]]; then
            "$RUNNER_TEMP/engine-venv/bin/python" -m pip install -r workers/emulation/requirements-qiling.txt
          fi
      - name: Build fixed adapters and owned fixtures
        shell: bash
        run: |
          set -euo pipefail
          bash workers/emulation/build-fixtures.sh
          if [[ '${{ matrix.engine }}' == unidbg ]]; then
            mvn -B -q -f workers/emulation/unidbg/pom.xml package dependency:copy-dependencies -DskipTests
          elif [[ '${{ matrix.engine }}' == rnidbg ]]; then
            rustup toolchain install 1.85.1 --profile minimal
            rustup default 1.85.1
            bash workers/emulation/build-rnidbg.sh
          fi
      - name: Seal reviewed runtime and run owned protocol acceptance
        shell: bash
        env:
          CLINE_RE_ISOLATED_WORKER: disposable-network-disabled
          CLINE_TEST_EMULATION_ENGINE: ${{ matrix.engine }}
        run: |
          set -euo pipefail
          export CLINE_EMULATION_INVENTORY="$RUNNER_TEMP/${CLINE_TEST_EMULATION_ENGINE}.inventory.json"
          "$RUNNER_TEMP/engine-venv/bin/python" workers/emulation/runtime_inventory.py "$CLINE_TEST_EMULATION_ENGINE" "$CLINE_EMULATION_INVENTORY" --fixtures workers/emulation/fixtures/build --java-home "$JAVA_HOME" --unidbg-build workers/emulation/unidbg/target --rnidbg-binary workers/emulation/rnidbg/target/release/cline-rnidbg-runner
          "$RUNNER_TEMP/engine-venv/bin/python" workers/emulation/contracts.test.py
          "$RUNNER_TEMP/engine-venv/bin/python" workers/emulation/real.test.py
          "$RUNNER_TEMP/engine-venv/bin/python" workers/re-analysis/server.test.py
      - name: Scope statement
        run: echo 'Owned fixtures only. No untrusted target, native execution, VM-isolation attestation, complete Android or whole-app verification claim.'
