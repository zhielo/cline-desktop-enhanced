name: Clean reverse-engineering hardening diff

on:
  push:
    branches:
      - hardening/ida-ghidra-debugging

permissions:
  contents: write

jobs:
  cleanup-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Restore unrelated formatting
        run: git checkout origin/main -- sdk/packages/core/src/extensions/tools/executors/file-read.ts sdk/packages/core/src/extensions/tools/presets.test.ts
      - run: bun install --frozen-lockfile
      - run: bun run build:sdk
      - run: bun -F @cline/core typecheck
      - run: cd sdk/packages/core && bun x vitest run src/extensions/tools/executors/reverse-engineering.test.ts src/extensions/tools/executors/supervised-process.test.ts src/extensions/tools/executors/live-debugger.test.ts --config vitest.config.ts
      - run: bun scripts/verify-custom-fork.ts
      - name: Commit cleanup
        run: |
          git rm .github/workflows/cleanup-re-hardening.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          HUSKY=0 git commit -m "chore: remove unrelated formatting changes"
          git push
