name: Specialist engine acceptance
on:
  pull_request:
    branches: [main, desktop-experimental]
  push:
    branches: [main, desktop-experimental]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: specialist-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  symbolic:
    name: Owned angr fixture (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install angr==9.2.185 pycparser==2.22 bitstring==4.3.1
      - name: Contracts and real bounded symbolic execution
        env:
          CLINE_TEST_REAL_ANGR: '1'
        run: python sdk/packages/core/scripts/re-specialist-worker.test.py
  speakeasy:
    name: Owned isolated-worker protocol and PE emulation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r workers/re-analysis/requirements.txt
      - name: Signed real collector and no-replay service acceptance
        env:
          CLINE_TEST_REAL_SPEAKEASY: '1'
        run: python workers/re-analysis/server.test.py
      - name: Real owned PE entry point (not untrusted target acceptance)
        env:
          CLINE_TEST_REAL_SPEAKEASY: '1'
        run: python workers/re-analysis/collector.test.py
      - run: python workers/android-capture/capture_support.test.py
  joern:
    name: Pinned Joern Linux parse and fixed queries
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare checksum-pinned distribution (no PATH fallback)
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/joernio/joern/releases/download/v4.0.662/joern-cli.zip -o "$RUNNER_TEMP/joern.zip"
          python scripts/prepare-joern-runtime.py "$RUNNER_TEMP/joern.zip" "$JAVA_HOME" "$RUNNER_TEMP/joern-pinned" > "$RUNNER_TEMP/joern-identity.json"
          python - <<'PY'
          import json,os
          value=json.load(open(os.environ['RUNNER_TEMP']+'/joern-identity.json'))
          with open(os.environ['GITHUB_ENV'],'a') as f:
              for key in ['CLINE_JOERN_HOME','CLINE_JOERN_MANIFEST_SHA256']:f.write(key+'='+value[key]+'\n')
          PY
      - name: Real owned parser and fixed-query fixtures
        env:
          CLINE_TEST_REAL_JOERN: '1'
        run: python sdk/packages/core/scripts/re-specialist-worker.test.py
