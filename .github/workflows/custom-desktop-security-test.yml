name: custom-desktop-security-test

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/examples/desktop-app/**"
      - "sdk/**"
      - "bun.lock"
      - ".github/workflows/custom-desktop-security-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-security:
    name: Validate desktop security boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build SDK packages
        run: bun run build:sdk

      - name: Typecheck desktop app
        run: bun -F @cline/code typecheck

      - name: Run desktop sidecar tests
        run: bun -F @cline/code test:sidecar

      - name: Build production webview
        run: bun -F @cline/code build:web
