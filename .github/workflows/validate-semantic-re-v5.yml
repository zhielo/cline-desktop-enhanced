name: V5 consolidated source and native evidence (no installer)
on:
  push:
    branches: [dev/semantic-re-v5-20261005]
    paths: [.github/workflows/validate-semantic-re-v5.yml, docs/V5_VALIDATION_REQUEST.md]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v5-source-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-v5-source:
    name: Source gates and owned native fixtures only
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.13'
      - name: Initialize evidence directory
        run: |
          mkdir -p .cline-native-validation
          printf 'Source commit: %s\nNo installer, release or target execution is produced by this workflow.\n' "$GITHUB_SHA" > .cline-native-validation/source.txt
      - name: Install frozen source dependencies
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          (cd sdk && bun install --frozen-lockfile)
      - name: Install pinned analysis packages and reviewed Ghidra distribution
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/v5-python"
          "$RUNNER_TEMP/v5-python/bin/python" -m pip install --disable-pip-version-check -r sdk/packages/core/scripts/requirements-advanced-analysis.txt
          echo "CLINE_RE_PYTHON=$RUNNER_TEMP/v5-python/bin/python" >> "$GITHUB_ENV"
          bash scripts/prepare-v5-native-engines.sh "$RUNNER_TEMP/v5-native" 2>&1 | tee .cline-native-validation/setup.log
      - name: Run all existing source gates and real Python/model corpora
        run: |
          set -euo pipefail
          bun run validate:advanced --engines --semantic-engines
      - name: Require real Ghidra through the artifact-copying SDK adapter
        working-directory: sdk
        run: |
          set -euo pipefail
          bun test packages/core/scripts/native-program-engine-smoke.test.ts 2>&1 | tee ../.cline-native-validation/native.log
      - name: Preserve source and real-engine evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: v5-source-native-evidence-${{ github.run_id }}
          path: |
            .cline-validation/**
            .cline-native-validation/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
