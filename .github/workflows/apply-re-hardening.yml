name: Apply reverse-engineering hardening

on:
  push:
    branches:
      - hardening/ida-ghidra-debugging

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: python3 scripts/apply-re-hardening.py
      - run: bun install --frozen-lockfile
      - run: bun biome format --write sdk/packages/core/src/extensions/tools CUSTOMIZATIONS.md docs/LIVE_DEBUGGING.md scripts/verify-custom-fork.ts
      - run: bun run build:sdk
      - run: bun -F @cline/core typecheck
      - run: cd sdk/packages/core && bun x vitest run src/extensions/tools/executors/reverse-engineering.test.ts src/extensions/tools/executors/supervised-process.test.ts src/extensions/tools/executors/live-debugger.test.ts --config vitest.config.ts
      - run: bun scripts/verify-custom-fork.ts
      - name: Commit validated changes
        run: |
          git rm .github/workflows/apply-re-hardening.yml scripts/apply-re-hardening.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: harden reverse engineering and add live debugging"
          git push
