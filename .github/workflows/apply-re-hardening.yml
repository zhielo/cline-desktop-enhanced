name: Apply reverse-engineering hardening

on:
  push:
    branches:
      - hardening/ida-ghidra-debugging

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Apply source changes
        run: set -o pipefail; python3 scripts/apply-re-hardening.py 2>&1 | tee -a /tmp/hardening.log
      - name: Install dependencies
        run: set -o pipefail; bun install --frozen-lockfile 2>&1 | tee -a /tmp/hardening.log
      - name: Format
        run: set -o pipefail; bun biome format --write sdk/packages/core/src/extensions/tools CUSTOMIZATIONS.md docs/LIVE_DEBUGGING.md scripts/verify-custom-fork.ts 2>&1 | tee -a /tmp/hardening.log
      - name: Build SDK
        run: set -o pipefail; bun run build:sdk 2>&1 | tee -a /tmp/hardening.log
      - name: Type-check core
        run: set -o pipefail; bun -F @cline/core typecheck 2>&1 | tee -a /tmp/hardening.log
      - name: Focused tests
        run: set -o pipefail; cd sdk/packages/core && bun x vitest run src/extensions/tools/executors/reverse-engineering.test.ts src/extensions/tools/executors/supervised-process.test.ts src/extensions/tools/executors/live-debugger.test.ts --config vitest.config.ts 2>&1 | tee -a /tmp/hardening.log
      - name: Verify custom fork
        run: set -o pipefail; bun scripts/verify-custom-fork.ts 2>&1 | tee -a /tmp/hardening.log
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo 'Hardening workflow failed. Last log lines:'; echo '```text'; tail -n 180 /tmp/hardening.log; echo '```'; } > /tmp/comment.md
          gh pr comment 18 --body-file /tmp/comment.md
      - name: Commit validated changes
        run: |
          git rm .github/workflows/apply-re-hardening.yml scripts/apply-re-hardening.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: harden reverse engineering and add live debugging"
          git push
