name: Managed emulation inert transport foundation
on:
  pull_request:
    paths:
      - workers/managed-emulation/**
      - .github/workflows/managed-emulation-transport.yml
  push:
    branches: [main]
    paths:
      - workers/managed-emulation/**
      - .github/workflows/managed-emulation-transport.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: managed-inert-transport-${{ github.ref }}
  cancel-in-progress: true
jobs:
  protocol:
    name: Managed inert transport contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Select pinned native compiler
        shell: bash
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
      - name: Native locked protocol, lifecycle, storage and kill/reopen tests
        run: cargo +1.85.1 test --locked --manifest-path workers/managed-emulation/host/Cargo.toml
      - name: Native formatting
        run: cargo +1.85.1 fmt --manifest-path workers/managed-emulation/host/Cargo.toml -- --check
      - name: Native lint
        run: cargo +1.85.1 clippy --locked --manifest-path workers/managed-emulation/host/Cargo.toml --all-targets -- -D warnings
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: matrix.os == 'ubuntu-latest'
        with:
          python-version: '3.13'
      - name: Guest protocol, credential-path and owned socketpair regressions
        if: matrix.os == 'ubuntu-latest'
        run: python -B workers/managed-emulation/probe_protocol_test.py
      - name: Record scope
        shell: bash
        run: echo 'Protocol/process, lifecycle reducer, real SQLite kill/reopen storage and credential-path tests only. No physical-power-loss, protected broker, actual VM lifecycle, Hyper-V connection, framework installation or containment acceptance.'