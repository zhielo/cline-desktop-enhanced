name: Managed emulation inert transport foundation
on:
  # Required exact-head release checks must run for every pull request.
  pull_request: {}
  push:
    branches: [main]
    paths:
      - workers/managed-emulation/**
      - .github/workflows/managed-emulation-transport.yml
      - apps/examples/desktop-app/sidecar/managed-emulation-pack*
      - scripts/managed-emulation-pack-install.test.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: managed-inert-transport-${{ github.ref }}
  cancel-in-progress: true
jobs:
  protocol:
    name: Managed inert transport contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Select pinned native compiler
        shell: bash
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
      - name: Native locked protocol, lifecycle, storage and kill/reopen tests
        run: cargo +1.85.1 test --locked --manifest-path workers/managed-emulation/host/Cargo.toml
      - name: Build explicit CI-only SYSTEM roots fixture
        if: matrix.os == 'windows-latest'
        run: cargo +1.85.1 build --locked --manifest-path workers/managed-emulation/host/Cargo.toml --features owned-system-acceptance --bin owned-system-roots-fixture --bin owned-local-service-fixture
      - name: Actual LocalSystem protected roots acceptance (no Hyper-V)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./workers/managed-emulation/host/test-system-roots.ps1
      - name: Native formatting
        run: cargo +1.85.1 fmt --manifest-path workers/managed-emulation/host/Cargo.toml -- --check
      - name: Native real-file selected and all-four pack installation transactions
        run: node --test scripts/managed-emulation-pack-install.test.mjs
      - name: Native lint
        run: cargo +1.85.1 clippy --locked --manifest-path workers/managed-emulation/host/Cargo.toml --all-targets --all-features -- -D warnings
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: matrix.os == 'ubuntu-latest'
        with:
          python-version: '3.13'
      - name: Guest protocol, credential-path and owned socketpair regressions
        if: matrix.os == 'ubuntu-latest'
        run: python -B workers/managed-emulation/probe_protocol_test.py
      - name: Record scope
        shell: bash
        run: echo 'Protocol/process, lifecycle reducer, real SQLite kill/reopen storage and credential-path tests only. Native Windows additionally checks owned protected ACLs, fixed SYSTEM roots and a temporary inert SCM host with verified stop/process exit/removal. No physical-power-loss, released protected broker, actual VM lifecycle, Hyper-V connection, framework installation or containment acceptance.'