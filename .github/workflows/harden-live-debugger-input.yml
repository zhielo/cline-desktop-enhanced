name: Harden live debugger input

on:
  push:
    branches:
      - hardening/ida-ghidra-debugging

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Apply command-input hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text()
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one occurrence, found {count}")
              file.write_text(source.replace(old, new, 1))

          schemas = "sdk/packages/core/src/extensions/tools/schemas.ts"
          replace_once(
              schemas,
              "/** Supervised one-shot live debugging for explicitly authorized local targets. */\nexport const LiveDebuggerInputSchema = z.object({",
              "/** Only debugger locations that cannot introduce an additional GDB/LLDB command. */\nconst SAFE_DEBUGGER_LOCATION_PATTERN =\n\t/^(?:0x[0-9a-fA-F]+|[A-Za-z_.$][\\w.$:+-]*)$/;\n\n/** Supervised one-shot live debugging for explicitly authorized local targets. */\nexport const LiveDebuggerInputSchema = z.object({",
          )
          replace_once(
              schemas,
              "\tbreakpoint: z.string().min(1).max(1_024).optional(),\n\taddress: z\n\t\t.string()\n\t\t.regex(/^(?:0x[0-9a-fA-F]+|[A-Za-z_.$][\\w.$:+-]*)$/)\n\t\t.optional(),",
              "\tbreakpoint: z\n\t\t.string()\n\t\t.min(1)\n\t\t.max(1_024)\n\t\t.regex(SAFE_DEBUGGER_LOCATION_PATTERN)\n\t\t.optional(),\n\taddress: z\n\t\t.string()\n\t\t.regex(SAFE_DEBUGGER_LOCATION_PATTERN)\n\t\t.optional(),",
          )

          test = "sdk/packages/core/src/extensions/tools/executors/live-debugger.test.ts"
          replace_once(
              test,
              'import { afterEach, describe, expect, it } from "vitest";\nimport { createLiveDebuggerExecutor } from "./live-debugger";',
              'import { afterEach, describe, expect, it } from "vitest";\nimport { LiveDebuggerInputSchema } from "../schemas";\nimport { createLiveDebuggerExecutor } from "./live-debugger";',
          )
          file = Path(test)
          source = file.read_text()
          source += '''\n\ndescribe("debugger location validation", () => {\n\tit("accepts bounded symbols and addresses", () => {\n\t\tfor (const breakpoint of ["main", "Namespace::method", "0x401000"]) {\n\t\t\texpect(\n\t\t\t\tLiveDebuggerInputSchema.parse({\n\t\t\t\t\toperation: "launch",\n\t\t\t\t\ttarget: "/tmp/sample",\n\t\t\t\t\tbreakpoint,\n\t\t\t\t}).breakpoint,\n\t\t\t).toBe(breakpoint);\n\t\t}\n\t});\n\n\tit("rejects breakpoint values that could introduce debugger commands", () => {\n\t\tfor (const breakpoint of [\n\t\t\t"main; shell whoami",\n\t\t\t"main\\nshell whoami",\n\t\t\t"main -ex quit",\n\t\t]) {\n\t\t\texpect(() =>\n\t\t\t\tLiveDebuggerInputSchema.parse({\n\t\t\t\t\toperation: "launch",\n\t\t\t\t\ttarget: "/tmp/sample",\n\t\t\t\t\tbreakpoint,\n\t\t\t\t}),\n\t\t\t).toThrow();\n\t\t}\n\t});\n});\n'''
          file.write_text(source)

          replace_once(
              "CUSTOMIZATIONS.md",
              "- A separate opt-in `live_debugger` tool provides explicitly acknowledged, bounded, one-shot GDB/LLDB launch and attach workflows; see `docs/LIVE_DEBUGGING.md`.",
              "- A separate opt-in `live_debugger` tool provides explicitly acknowledged, bounded, one-shot GDB/LLDB launch and attach workflows with command-safe breakpoint and address validation; see `docs/LIVE_DEBUGGING.md`.",
          )
          replace_once(
              "scripts/verify-custom-fork.ts",
              '\t{\n\t\tpath: "sdk/packages/core/src/extensions/tools/executors/live-debugger.ts",\n\t\tmarkers: ["acknowledge_risk=true", "persistentSession", "process detach"],\n\t},',
              '\t{\n\t\tpath: "sdk/packages/core/src/extensions/tools/executors/live-debugger.ts",\n\t\tmarkers: ["acknowledge_risk=true", "persistentSession", "process detach"],\n\t},\n\t{\n\t\tpath: "sdk/packages/core/src/extensions/tools/schemas.ts",\n\t\tmarkers: ["SAFE_DEBUGGER_LOCATION_PATTERN"],\n\t},',
          )
          PY
      - run: bun install --frozen-lockfile
      - run: bunx --bun @biomejs/biome format --write sdk/packages/core/src/extensions/tools/schemas.ts sdk/packages/core/src/extensions/tools/executors/live-debugger.test.ts CUSTOMIZATIONS.md scripts/verify-custom-fork.ts
      - run: bun run build:sdk
      - run: bun -F @cline/core typecheck
      - run: cd sdk/packages/core && bun x vitest run src/extensions/tools/executors/reverse-engineering.test.ts src/extensions/tools/executors/supervised-process.test.ts src/extensions/tools/executors/live-debugger.test.ts --config vitest.config.ts
      - run: bun scripts/verify-custom-fork.ts
      - name: Commit validated hardening
        run: |
          git rm .github/workflows/harden-live-debugger-input.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          HUSKY=0 git commit -m "fix: validate live debugger locations"
          git push