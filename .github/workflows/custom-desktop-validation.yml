name: Validate custom desktop

on:
  push:
    branches: [main, desktop-experimental]
  pull_request:
    branches: [main, desktop-experimental]
  workflow_dispatch:

concurrency:
  group: custom-desktop-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.28.0"
  NSIS_VERSION: "3.11"

jobs:
  regression:
    name: Windows regression gates
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read supported Bun version

        id: toolchain

        shell: bash

        run: echo "version=$(node "$GITHUB_WORKSPACE/scripts/read-bun-version.mjs")" >> "$GITHUB_OUTPUT"


      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.toolchain.outputs.version }}

      - name: Setup validation tools
        shell: pwsh
        run: |
          choco install gitleaks --version=$env:GITLEAKS_VERSION --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Gitleaks installation failed' }
          $zip = Join-Path $env:RUNNER_TEMP 'nsis.zip'
          $url = "https://github.com/tauri-apps/binary-releases/releases/download/nsis-$env:NSIS_VERSION/nsis-$env:NSIS_VERSION.zip"
          Invoke-WebRequest $url -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA1).Hash -ne 'EF7FF767E5CBD9EDD22ADD3A32C9B8F4500BB10D') {
            throw 'NSIS distribution checksum mismatch'
          }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "MAKENSIS_PATH=$env:RUNNER_TEMP/nsis-$env:NSIS_VERSION/makensis.exe" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan repository for committed secrets
        shell: bash
        run: gitleaks git --redact --no-banner --config .gitleaks.toml

      - name: Consolidated blocking regression gates
        env:
          CLINE_VALIDATION_PARALLEL: "1"
        run: bun run validate:advanced

      - name: Upload regression evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: custom-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cline-validation/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
