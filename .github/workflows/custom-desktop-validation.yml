name: Validate custom desktop

on:
  push:
    branches: [main, desktop-experimental]
  pull_request:
    branches: [main, desktop-experimental]
  workflow_dispatch:

concurrency:
  group: custom-desktop-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.28.0"
  NSIS_VERSION: "3.11"

jobs:
  regression:
    name: Windows regression gates
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Read supported Bun version

        id: toolchain

        shell: bash

        run: echo "version=$(node "$GITHUB_WORKSPACE/scripts/read-bun-version.mjs")" >> "$GITHUB_OUTPUT"


      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.toolchain.outputs.version }}

      - name: Fast verification preflight
        run: bun run validate:quick

      - name: Restore locked Bun download cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('bun.lock', 'workers/android-capture/bun.lock') }}

      - name: Setup validation tools
        shell: pwsh
        run: |
          & scripts/install-pinned-gitleaks.ps1 -Version $env:GITLEAKS_VERSION
          $zip = Join-Path $env:RUNNER_TEMP 'nsis.zip'
          $url = "https://github.com/tauri-apps/binary-releases/releases/download/nsis-$env:NSIS_VERSION/nsis-$env:NSIS_VERSION.zip"
          Invoke-WebRequest $url -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne 'C7D27F780DDB6CFFB4730138CD1591E841F4B7EDB155856901CDF5F214394FA1') {
            throw 'NSIS distribution checksum mismatch'
          }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "MAKENSIS_PATH=$env:RUNNER_TEMP/nsis-$env:NSIS_VERSION/makensis.exe" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan repository for committed secrets
        shell: bash
        run: gitleaks git --redact --no-banner --config .gitleaks.toml

      - name: Consolidated blocking regression gates
        env:
          CLINE_VALIDATION_PARALLEL: "1"
        run: bun run validate:advanced

      - name: Summarize verification bottlenecks
        if: ${{ always() }}
        run: node scripts/summarize-verification.mjs

      - name: Upload regression evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: custom-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cline-validation/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  isolated-execute:
    name: Windows isolated Execute boundary
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read supported Bun version
        id: toolchain
        shell: bash
        run: echo "version=$(node "$GITHUB_WORKSPACE/scripts/read-bun-version.mjs")" >> "$GITHUB_OUTPUT"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.toolchain.outputs.version }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build SDK prerequisite
        run: bun run build:sdk
      - name: Test actual isolated execution and diagnostic boundary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .isolation-evidence | Out-Null
          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = 'Continue'
          $global:LASTEXITCODE = 1
          bun test apps/examples/desktop-app/scripts/isolation-host-failure.test.ts apps/examples/desktop-app/scripts/javascript-isolation.test.ts 2>&1 | Tee-Object -FilePath .isolation-evidence/isolation.log
          $code = $LASTEXITCODE
          exit $code
      - name: Upload isolation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: isolated-execute-${{ github.run_id }}-${{ github.run_attempt }}
          path: .isolation-evidence/isolation.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  binary-triage:
    name: Windows Binary Triage owned engines
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read supported Bun version
        id: toolchain
        shell: bash
        run: echo "version=$(node "$GITHUB_WORKSPACE/scripts/read-bun-version.mjs")" >> "$GITHUB_OUTPUT"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.toolchain.outputs.version }}
      - name: Install dependencies and build SDK
        run: bun install --frozen-lockfile && bun run build:sdk
      - name: Prepare isolated triage bindings
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'cline-triage-bindings'
          py -3.13 -m venv $root
          if ($LASTEXITCODE -ne 0) { throw 'Triage Python creation failed' }
          $python = Join-Path $root 'Scripts/python.exe'
          & $python -m pip install r2pipe==2.0.0 yara-python==4.5.4
          if ($LASTEXITCODE -ne 0) { throw 'Pinned triage binding installation failed' }
          "CLINE_RE_PYTHON=$python" >> $env:GITHUB_ENV
      - name: Test pinned native triage engines
        shell: pwsh
        run: ./scripts/package-binary-triage.ps1
      - name: Test triage with shipped-style isolated embedded Python
        shell: pwsh
        run: ./scripts/test-embedded-binary-triage.ps1 -EnginePython $env:CLINE_RE_PYTHON
