name: Validate custom desktop

on:
  push:
    branches: [main, desktop-experimental]
    paths:
      - "apps/examples/desktop-app/**"
      - "sdk/**"
      - "scripts/verify-custom-fork.ts"
      - "package.json"
      - "bun.lock"
      - ".gitleaks.toml"
      - ".github/workflows/custom-desktop-validation.yml"
      - ".github/workflows/build-custom-windows-installer.yml"
  pull_request:
    branches: [main, desktop-experimental]
    paths:
      - "apps/examples/desktop-app/**"
      - "sdk/**"
      - "scripts/verify-custom-fork.ts"
      - "package.json"
      - "bun.lock"
      - ".gitleaks.toml"
      - ".github/workflows/custom-desktop-validation.yml"
      - ".github/workflows/build-custom-windows-installer.yml"
  workflow_dispatch:

concurrency:
  group: custom-desktop-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"
  GITLEAKS_VERSION: "8.28.0"
  NSIS_VERSION: "3.11"

jobs:
  regression:
    name: Windows regression gates
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup validation tools
        shell: pwsh
        run: |
          choco install gitleaks --version=$env:GITLEAKS_VERSION --no-progress -y
          $zip = Join-Path $env:RUNNER_TEMP 'nsis.zip'
          $url = "https://github.com/tauri-apps/binary-releases/releases/download/nsis-$env:NSIS_VERSION/nsis-$env:NSIS_VERSION.zip"
          Invoke-WebRequest $url -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA1).Hash -ne 'EF7FF767E5CBD9EDD22ADD3A32C9B8F4500BB10D') {
            throw 'NSIS distribution checksum mismatch'
          }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "MAKENSIS_PATH=$env:RUNNER_TEMP/nsis-$env:NSIS_VERSION/makensis.exe" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan repository for committed secrets
        shell: bash
        run: gitleaks git --redact --no-banner --config .gitleaks.toml

      - name: Verify custom fork preservation
        run: bun run scripts/verify-custom-fork.ts

      - name: Build SDK packages
        run: bun run build:sdk

      - name: Run desktop gates
        working-directory: apps/examples/desktop-app
        run: |
          bun run typecheck
          bun run test:sidecar
          bun run test:windows-installer
          bun x vitest run webview/lib/task-report.test.ts --config vitest.config.mts

      - name: Run focused customization gates
        shell: bash
        run: |
          bunx vitest run \
            apps/examples/desktop-app/sidecar/analysis-task-orchestrator.test.ts \
            apps/examples/desktop-app/sidecar/browser-manager.test.ts \
            apps/examples/desktop-app/sidecar/commands-workbench.test.ts \
            apps/examples/desktop-app/sidecar/repository-tool.test.ts \
            --config apps/examples/desktop-app/vitest.config.mts
          bunx vitest run \
            sdk/packages/core/src/extensions/tools/executors/android-device.test.ts \
            sdk/packages/core/src/extensions/tools/executors/live-debugger.test.ts \
            sdk/packages/core/src/extensions/tools/executors/process-session-manager.test.ts \
            sdk/packages/core/src/extensions/tools/executors/reverse-engineering.test.ts \
            sdk/packages/core/src/extensions/tools/permission-profile.test.ts \
            sdk/packages/core/src/extensions/tools/presets.test.ts \
            sdk/packages/core/src/extensions/tools/runtime.test.ts \
            --config vitest.config.mts
          bun build sdk/packages/core/scripts/process-session-terminal-smoke.ts \
            --compile \
            --outfile "$RUNNER_TEMP/process-session-terminal-smoke.exe"
          "$RUNNER_TEMP/process-session-terminal-smoke.exe"
