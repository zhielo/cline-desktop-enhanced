name: apply-advanced-re-ui
on:
  push:
    paths:
      - .github/advanced-re-ui.patch.gz.b64
      - .github/workflows/apply-advanced-re-ui.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/windows-re-tooling-task-ui
          fetch-depth: 0
      - name: Apply validated patch
        run: |
          base64 -d .github/advanced-re-ui.patch.gz.b64 | gzip -d > /tmp/advanced.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am /tmp/advanced.patch
          git rm -f .github/advanced-re-ui.patch.gz.b64 .github/patch-chunks/part00 .github/workflows/apply-advanced-re-ui.yml
          git commit -m "Remove temporary patch transfer files"
          git push origin HEAD:feature/windows-re-tooling-task-ui
