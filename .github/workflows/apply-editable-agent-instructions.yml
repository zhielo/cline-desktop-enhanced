name: Apply editable agent instructions

on:
  push:
    branches:
      - feature/windows-re-tooling-task-ui
    paths:
      - ".github/patches/editable-agent-instructions.patch.gz.b64.part-*"
      - ".github/workflows/apply-editable-agent-instructions.yml"

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/windows-re-tooling-task-ui

      - name: Apply validated feature commit
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/editable-agent-instructions.patch.gz.b64.part-* | base64 --decode | gzip --decompress > /tmp/editable-agent-instructions.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am /tmp/editable-agent-instructions.patch
          git rm .github/patches/editable-agent-instructions.patch.gz.b64.part-*
          git rm .github/workflows/apply-editable-agent-instructions.yml
          git commit -m "chore: remove one-time feature publisher"
          git push origin HEAD:feature/windows-re-tooling-task-ui

      - name: Start Windows installer build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-custom-windows-installer.yml --ref feature/windows-re-tooling-task-ui
