[package]
name = "cline-managed-inert-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
getrandom = "=0.3.4"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
hex = "=0.4.3"
hmac = "=0.12.1"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.8"
zeroize = "=1.8.1"

[target.'cfg(windows)'.dependencies]
socket2 = { version = "=0.5.9", features = ["all"] }
windows = { version = "=0.58.0", features = ["Win32_System_Com", "Win32_System_Wmi", "Win32_System_Variant", "Win32_Security", "Win32_System_Rpc"] }
windows-sys = { version = "=0.52.0", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Services", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming", "Win32_UI_Shell"] }

[[test]]
name = "store_crash"
path = "tests/store_crash.rs"
harness = false

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.52.0", features = ["Win32_System_IO"] }

[features]
owned-system-acceptance = []

[[bin]]
name = "owned-system-roots-fixture"
path = "src/bin/owned-system-roots-fixture.rs"
required-features = ["owned-system-acceptance"]

[[bin]]
name = "owned-local-service-fixture"
path = "src/bin/owned-local-service-fixture.rs"
required-features = ["owned-system-acceptance"]
