[package]
name = "cline-managed-inert-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
getrandom = "=0.3.4"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
hex = "=0.4.3"
hmac = "=0.12.1"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.8"
zeroize = "=1.8.1"

[target.'cfg(windows)'.dependencies]
socket2 = { version = "=0.5.9", features = ["all"] }

[[test]]
name = "store_crash"
path = "tests/store_crash.rs"
harness = false
